include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - unawaited_futures

formatter:
  page_width: 120
